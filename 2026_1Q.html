<head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arenna Board Meeting — Q2 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF9F3;
    --blue: #454A60;
    --mint: #B7D7C0;
    --green: #718F85;
    --pink: #ECCDBC;
    --orange: #ED7A42;
    --terra: #B93700;
    --white: #ffffff;
    --gray-light: #f4f4f0;
    --gray-mid: #d0d0cc;
    --text-dark: #1a1c28;
    --text-mid: #454A60;
    --text-soft: #8a8d9e;
    --nav-w: 260px;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(69,74,96,0.10);
    --shadow-md: 0 8px 40px rgba(69,74,96,0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Red Hat Display', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    display: flex;
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ─── SIDEBAR NAV ─── */
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: var(--nav-w);
    height: 100vh;
    background: var(--blue);
    display: flex;
    flex-direction: column;
    z-index: 100;
    overflow-y: auto;
    transition: transform 0.3s ease;
  }

  .sidebar-logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .sidebar-logo .brand-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--cream);
    letter-spacing: -0.5px;
  }

  .sidebar-logo .brand-tagline {
    font-family: 'Noto Serif', serif;
    font-style: italic;
    font-size: 11px;
    color: rgba(255,249,243,0.5);
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .sidebar-meta {
    padding: 14px 24px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,249,243,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .nav-items {
    padding: 12px 0;
    flex: 1;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    border-left: 3px solid transparent;
  }

  .nav-item:hover {
    background: rgba(255,249,243,0.07);
  }

  .nav-item.active {
    background: rgba(255,249,243,0.1);
    border-left-color: var(--orange);
  }

  .nav-item.active .nav-label {
    color: var(--cream);
    font-weight: 600;
  }

  .nav-num {
    font-size: 10px;
    font-weight: 700;
    color: rgba(255,249,243,0.3);
    min-width: 18px;
  }

  .nav-label {
    font-size: 12px;
    color: rgba(255,249,243,0.65);
    font-weight: 500;
    line-height: 1.3;
  }

  .nav-status {
    margin-left: auto;
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 2px 6px;
    border-radius: 20px;
  }

  .status-track { background: rgba(183,215,192,0.2); color: var(--mint); }
  .status-progress { background: rgba(237,122,66,0.2); color: var(--orange); }
  .status-pending { background: rgba(255,249,243,0.1); color: rgba(255,249,243,0.4); }
  .status-decision { background: rgba(185,55,0,0.25); color: #f97c4e; }

  .sidebar-footer {
    padding: 20px 24px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 10px;
    color: rgba(255,249,243,0.3);
  }

  /* ─── MAIN CONTENT ─── */
  .main {
    margin-left: var(--nav-w);
    flex: 1;
    padding: 0;
  }

  /* ─── TOP HEADER ─── */
  .top-header {
    background: var(--blue);
    padding: 32px 48px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .header-left h1 {
    font-size: 28px;
    font-weight: 800;
    color: var(--cream);
    letter-spacing: -0.5px;
  }

  .header-left .header-sub {
    font-family: 'Noto Serif', serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(255,249,243,0.55);
    margin-top: 4px;
  }

  .header-right {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .header-date {
    font-size: 12px;
    color: rgba(255,249,243,0.45);
    text-align: right;
  }

  .header-date strong {
    display: block;
    font-size: 14px;
    color: rgba(255,249,243,0.7);
    font-weight: 600;
  }

  /* ─── EXEC SUMMARY DASHBOARD ─── */
  .exec-summary {
    padding: 40px 48px;
    background: var(--cream);
    border-bottom: 1px solid var(--gray-mid);
  }

  .section-eyebrow {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--orange);
    margin-bottom: 8px;
  }

  .section-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--blue);
    letter-spacing: -0.3px;
  }

  .section-subtitle {
    font-family: 'Noto Serif', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--text-soft);
    margin-top: 4px;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 28px;
  }

  .summary-card {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    border: 1px solid rgba(69,74,96,0.08);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .summary-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .summary-card.track::before { background: var(--mint); }
  .summary-card.progress::before { background: var(--orange); }
  .summary-card.pending::before { background: var(--gray-mid); }
  .summary-card.decision::before { background: var(--terra); }

  .summary-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .summary-card.featured {
    border-color: var(--orange);
    box-shadow: 0 0 0 2px rgba(237,122,66,0.15), var(--shadow);
  }

  .summary-card .card-num {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-soft);
  }

  .summary-card .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--blue);
    margin-top: 6px;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .summary-card .card-note {
    font-size: 11px;
    color: var(--text-soft);
    line-height: 1.5;
  }

  .chip {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 20px;
    margin-top: 10px;
  }

  .chip-track { background: rgba(183,215,192,0.3); color: #2d6e45; }
  .chip-progress { background: rgba(237,122,66,0.15); color: var(--terra); }
  .chip-pending { background: rgba(69,74,96,0.1); color: var(--blue); }
  .chip-decision { background: rgba(185,55,0,0.1); color: var(--terra); }

  .featured-badge {
    position: absolute;
    top: 12px; right: 12px;
    font-size: 8px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: var(--orange);
    color: white;
    padding: 3px 7px;
    border-radius: 20px;
  }

  /* ─── SECTION WRAPPERS ─── */
  .section-wrapper {
    padding: 48px 48px;
    border-bottom: 1px solid rgba(69,74,96,0.08);
    scroll-margin-top: 0;
  }

  .section-wrapper:nth-child(even) {
    background: rgba(183,215,192,0.06);
  }

  /* ─── CONTENT COMPONENTS ─── */
  .content-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 24px;
  }

  .content-grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-top: 24px;
  }

  .card {
    background: white;
    border-radius: var(--radius);
    padding: 24px;
    border: 1px solid rgba(69,74,96,0.08);
    box-shadow: var(--shadow);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(69,74,96,0.07);
  }

  .card-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .icon-blue { background: rgba(69,74,96,0.1); }
  .icon-orange { background: rgba(237,122,66,0.12); }
  .icon-mint { background: rgba(183,215,192,0.25); }
  .icon-terra { background: rgba(185,55,0,0.1); }

  .card h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--blue);
  }

  .card p {
    font-size: 13px;
    color: var(--text-mid);
    line-height: 1.6;
  }

  /* ─── CALLOUT BOXES ─── */
  .callout {
    border-radius: var(--radius);
    padding: 18px 22px;
    margin: 20px 0;
    border-left: 4px solid;
    font-size: 13px;
    line-height: 1.6;
  }

  .callout-update { background: rgba(183,215,192,0.2); border-color: var(--green); }
  .callout-nextstep { background: rgba(237,122,66,0.08); border-color: var(--orange); }
  .callout-risk { background: rgba(185,55,0,0.07); border-color: var(--terra); }
  .callout-board { background: rgba(69,74,96,0.07); border-color: var(--blue); }
  .callout-decision { background: rgba(185,55,0,0.08); border-color: var(--terra); }

  .callout-title {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }

  .callout-update .callout-title { color: var(--green); }
  .callout-nextstep .callout-title { color: var(--orange); }
  .callout-risk .callout-title { color: var(--terra); }
  .callout-board .callout-title { color: var(--blue); }
  .callout-decision .callout-title { color: var(--terra); }

  /* ─── MILESTONE TIMELINE ─── */
  .timeline {
    margin-top: 24px;
    position: relative;
  }

  .timeline-item {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    align-items: flex-start;
  }

  .timeline-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 40px;
  }

  .timeline-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--orange);
    border: 3px solid var(--cream);
    box-shadow: 0 0 0 2px var(--orange);
    flex-shrink: 0;
    margin-top: 3px;
  }

  .timeline-dot.done { background: var(--green); box-shadow: 0 0 0 2px var(--green); }
  .timeline-dot.pending-dot { background: var(--gray-mid); box-shadow: 0 0 0 2px var(--gray-mid); }

  .timeline-line {
    width: 2px;
    flex: 1;
    background: var(--gray-mid);
    margin-top: 4px;
    min-height: 30px;
  }

  .timeline-content {
    flex: 1;
    padding-bottom: 8px;
  }

  .timeline-date {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--orange);
    margin-bottom: 3px;
  }

  .timeline-date.done-date { color: var(--green); }
  .timeline-date.pending-date { color: var(--text-soft); }

  .timeline-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 4px;
  }

  .timeline-desc {
    font-size: 12px;
    color: var(--text-soft);
    line-height: 1.5;
  }

  /* ─── DENVER FEATURED HERO ─── */
  .denver-hero {
    background: linear-gradient(135deg, var(--blue) 0%, #2d3148 100%);
    border-radius: 16px;
    padding: 36px 40px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .denver-hero::after {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: rgba(237,122,66,0.08);
  }

  .denver-hero::before {
    content: '';
    position: absolute;
    bottom: -80px; left: 40%;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(183,215,192,0.05);
  }

  .hero-left h2 {
    font-size: 32px;
    font-weight: 800;
    color: var(--cream);
    letter-spacing: -0.5px;
    position: relative;
    z-index: 2;
  }

  .hero-left p {
    font-family: 'Noto Serif', serif;
    font-style: italic;
    color: rgba(255,249,243,0.55);
    font-size: 14px;
    margin-top: 6px;
    position: relative;
    z-index: 2;
  }

  .hero-stats {
    display: flex;
    gap: 24px;
    position: relative;
    z-index: 2;
  }

  .hero-stat {
    text-align: center;
    padding: 16px 20px;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .hero-stat .stat-val {
    font-size: 26px;
    font-weight: 800;
    color: var(--orange);
    line-height: 1;
  }

  .hero-stat .stat-label {
    font-size: 10px;
    color: rgba(255,249,243,0.5);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  /* ─── PHOTO GALLERY ─── */
  .photo-gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 20px;
  }

  .photo-item {
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 4/3;
    position: relative;
    cursor: pointer;
    background: var(--gray-light);
  }

  .photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }

  .photo-item:hover img { transform: scale(1.05); }

  .photo-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.6));
    padding: 20px 12px 10px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .photo-item:hover .photo-overlay { opacity: 1; }

  .photo-overlay span {
    font-size: 11px;
    font-weight: 600;
    color: white;
  }

  .photo-item.large {
    grid-column: span 2;
    aspect-ratio: 16/9;
  }

  /* ─── GANTT CHART ─── */
  .gantt-container {
    margin-top: 24px;
    overflow-x: auto;
  }

  .gantt-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
  }

  .gantt-header {
    display: grid;
    grid-template-columns: 220px 80px repeat(8, 1fr);
    gap: 0;
    background: var(--blue);
    color: var(--cream);
    padding: 10px 12px;
    border-radius: 8px 8px 0 0;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .gantt-row {
    display: grid;
    grid-template-columns: 220px 80px repeat(8, 1fr);
    gap: 0;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(69,74,96,0.06);
    font-size: 11px;
  }

  .gantt-row:hover { background: rgba(69,74,96,0.03); }

  .gantt-row.group-row {
    background: rgba(69,74,96,0.05);
    font-weight: 700;
    font-size: 11px;
    color: var(--blue);
    padding: 6px 12px;
  }

  .gantt-cell-task {
    color: var(--text-mid);
    font-size: 11px;
    line-height: 1.3;
    padding-right: 8px;
  }

  .gantt-cell-owner {
    font-size: 10px;
    color: var(--text-soft);
  }

  .gantt-bar-cell {
    height: 26px;
    display: flex;
    align-items: center;
  }

  .gantt-bar {
    height: 14px;
    border-radius: 4px;
    width: 100%;
  }

  /* ─── MARKETING FUNNEL ─── */
  .funnel-container {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 0;
    align-items: center;
  }

  .funnel-stage {
    width: 100%;
    max-width: 600px;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    margin-bottom: 2px;
    border-radius: 6px;
  }

  .funnel-stage-top { background: rgba(69,74,96,0.9); clip-path: polygon(0 0, 100% 0, 90% 100%, 10% 100%); padding-bottom: 24px; }
  .funnel-stage-mid { background: rgba(69,74,96,0.7); clip-path: polygon(10% 0, 90% 0, 80% 100%, 20% 100%); padding-bottom: 24px; margin-top: -8px; }
  .funnel-stage-bot { background: var(--orange); clip-path: polygon(20% 0, 80% 0, 60% 100%, 40% 100%); margin-top: -8px; }

  .funnel-label {
    font-size: 13px;
    font-weight: 700;
    color: white;
    text-align: center;
    width: 100%;
    padding: 8px;
  }

  .funnel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-top: 20px;
  }

  .funnel-card {
    padding: 20px;
    border-radius: 10px;
    border: 1px solid rgba(69,74,96,0.12);
    background: white;
  }

  .funnel-card-top { border-top: 3px solid var(--blue); }
  .funnel-card-mid { border-top: 3px solid var(--green); }
  .funnel-card-bot { border-top: 3px solid var(--orange); }

  .funnel-card h4 {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .funnel-card-top h4 { color: var(--blue); }
  .funnel-card-mid h4 { color: var(--green); }
  .funnel-card-bot h4 { color: var(--orange); }

  .funnel-card ul {
    list-style: none;
    font-size: 12px;
    color: var(--text-mid);
    line-height: 1.8;
  }

  .funnel-card ul li::before { content: "→ "; color: var(--text-soft); }

  /* ─── BUDGET DONUT / BARS ─── */
  .budget-bars {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 16px;
  }

  .budget-bar-item {}

  .budget-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-mid);
    margin-bottom: 6px;
  }

  .budget-bar-track {
    height: 10px;
    background: rgba(69,74,96,0.1);
    border-radius: 5px;
    overflow: hidden;
  }

  .budget-bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 1s ease;
  }

  /* ─── PIPELINE / STAGES ─── */
  .pipeline {
    display: flex;
    gap: 0;
    margin-top: 24px;
    overflow-x: auto;
  }

  .pipeline-stage {
    flex: 1;
    min-width: 120px;
    padding: 16px;
    text-align: center;
    position: relative;
    background: white;
    border: 1px solid rgba(69,74,96,0.1);
  }

  .pipeline-stage:first-child { border-radius: 10px 0 0 10px; }
  .pipeline-stage:last-child { border-radius: 0 10px 10px 0; }

  .pipeline-stage.active-stage {
    background: var(--blue);
    color: white;
    z-index: 1;
    box-shadow: var(--shadow-md);
  }

  .pipeline-stage.done-stage { background: rgba(183,215,192,0.2); }

  .pipeline-arrow {
    position: absolute;
    right: -12px;
    top: 50%;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;
    border-left: 12px solid var(--gray-mid);
    z-index: 2;
  }

  .pipeline-stage.active-stage .pipeline-arrow { border-left-color: var(--blue); }
  .pipeline-stage.done-stage .pipeline-arrow { border-left-color: rgba(183,215,192,0.2); }

  .pipeline-stage h4 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .pipeline-stage p { font-size: 11px; opacity: 0.7; }

  /* ─── CASH FLOW TABLE ─── */
  .cf-table-wrap {
    overflow-x: auto;
    margin-top: 20px;
    border-radius: 10px;
    border: 1px solid rgba(69,74,96,0.1);
  }

  .cf-table {
    width: 100%;
    border-collapse: collapse;
